[package]
name = "bevy_asset_packer"
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "BSD-3-Clause"
description = "Build-time asset packing with optional compression and authenticated encryption for Bevy"
repository = "https://github.com/DublikuntMux/bevy_asset_packer"
readme = "README.md"
keywords = ["bevy", "assets", "bundle", "compression", "encryption"]
categories = ["game-development", "game-engines"]
exclude = [
    ".github/*",
]

[workspace]
members = ["example_app"]
default-members = ["."]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[lints]
workspace = true

[features]
default = ["runtime"]
runtime = ["dep:bevy", "dep:futures-lite"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anyhow = "1"
bevy = { version = "0.20.0", default-features = false, features = ["bevy_asset"], optional = true }
flate2 = "1"
futures-lite = { version = "2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blocking = "1"
rand = "0.10"
walkdir = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "ReadableStream", "RequestInit", "Response", "Window"] }

[dev-dependencies]
futures-lite = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
